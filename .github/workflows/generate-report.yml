name: Generate Daily Stock Report

on:
  schedule:
    - cron: '0 13 * * 1-5'  # Mon–Fri at 13:00 UTC (8:00 AM ET)
  workflow_dispatch:          # Manual run from Actions tab

permissions:
  contents: write             # Required to commit and push new reports

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet anthropic

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "report: $(date -u +%Y-%m-%d)"
          git push
